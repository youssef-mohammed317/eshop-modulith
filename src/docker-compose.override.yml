version: '3.8'

services:
  api:
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
      - ASPNETCORE_HTTPS_PORTS=8081
      # Database and Cache
      - ConnectionStrings__Database=Host=eshopdb;Port=5432;Database=eshopdb;Username=postgres;Password=postgres;
      - ConnectionStrings__Redis=redis:6379
      # RabbitMQ Configuration
      - MessageBroker__Host=rabbitmq
      - MessageBroker__Username=guest
      - MessageBroker__Password=guest
      # Override Serilog to point to the Seq container in the Docker network
      - Serilog__WriteTo__2__Args__serverUrl=http://seq:5341
    ports:
      - "6000:8080"
      - "6060:8081"
    volumes:
      - ${APPDATA}/Microsoft/UserSecrets:/home/app/.microsoft/usersecrets:ro
      - ${APPDATA}/Microsoft/UserSecrets:/root/.microsoft/usersecrets:ro
      - ${APPDATA}/ASP.NET/Https:/home/app/.aspnet/https:ro
      - ${APPDATA}/ASP.NET/Https:/root/.aspnet/https:ro
    depends_on:
      - eshopdb
      - rabbitmq
      - redis
      - seq
  
  eshopdb:
    container_name: eshopdb
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=eshopdb
    restart: always
    ports:
      - "5433:5432"
    volumes:
      - postgres_eshopdb:/var/lib/postgresql/data

  seq:
    container_name: seq
    environment:
      - ACCEPT_EULA=Y
    restart: always
    ports:
      - "5341:5341"
      - "9091:80"
    volumes:
      - seq_data:/data

  redis:
    container_name: redis
    restart: always
    ports:
      - "6380:6379"

  rabbitmq:
    container_name: eshop_rabbitmq
    restart: always
    hostname: rabbitmq
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
    ports:
      - "5672:5672"   # The standard AMQP protocol port used by MassTransit
      - "15672:15672" # The Management UI port
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq